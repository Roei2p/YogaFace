# Base44 development compose — runs the app FROM SOURCE with live reload.
# Frontend (Vite dev server) is exposed on host port 3000; it proxies API
# calls to the backend service so only one port is public.
# Rebuild/restart: docker compose -f docker-compose.base44.yml up -d --build

services:
  server:
    image: node:22-slim
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - ./data:/app/data
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
    command:
      [
        "sh",
        "-ec",
        "apt-get update -qq && apt-get install -y -qq openssl >/dev/null && npm install && npx prisma generate && npx prisma migrate deploy && exec npx tsx watch src/index.ts",
      ]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  web:
    image: node:22-slim
    working_dir: /app/web
    volumes:
      - ./web:/app/web
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Same-origin API calls — Vite proxies /api, /webhooks, /health to the
      # server service so the browser never needs a second origin.
      - VITE_API_BASE_URL=
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      server:
        condition: service_healthy
    command:
      ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
