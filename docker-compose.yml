services:
  # Combined API + dashboard (single process, see repo-root Dockerfile).
  app:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Reverse proxy that gets/renews a real HTTPS certificate automatically
  # (Let's Encrypt) for DOMAIN - required so Cardcom's webhook and the
  # dashboard both work over https:// from the outside.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional - only needed if you're using DuckDNS for dynamic DNS because
  # your home IP changes over time (see README). Not needed if your router
  # has a static IP or its own DDNS. Enable with:
  #   docker compose --profile duckdns up -d
  duckdns:
    image: alpine:3.20
    profiles: ["duckdns"]
    env_file:
      - .env
    entrypoint: >
      sh -c "while true; do
        wget -qO- \"https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=\";
        sleep 300;
      done"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
