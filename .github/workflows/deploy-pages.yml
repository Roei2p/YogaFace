name: Deploy dashboard demo to GitHub Pages

# Builds only the web/ dashboard (with fixture/demo data - there is no
# backend on GitHub Pages, see web/src/lib/demoData.ts) and publishes it
# as a static site. The real, fully working system (WhatsApp sync, billing
# webhooks, live data) is meant to run via the repo-root Dockerfile /
# render.yaml - see README.md.

on:
  push:
    branches:
      - claude/whatsapp-group-management-unfsrs
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm install
      - name: Build (demo mode)
        working-directory: web
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_BASE_URL: ""
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
